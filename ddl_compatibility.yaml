# ddl_compatibility.yaml
# Matrice de compatibilité des options DDL par version (ProductMajorVersion) et édition.
#
# Résolution : une option est APPLICABLE pour une opération si
#   target_major >= min_major  ET  target_tier ∈ editions
# Dépendances exprimées via `requires` (ex. resumable requiert online).
#
# Tiers d'édition (dérivés de SERVERPROPERTY('EngineEdition')) :
#   2 -> standard | 3 -> enterprise (Enterprise/Developer/Evaluation) | 4 -> express
#   5 -> azure (SQL Database) | 8 -> azure (Managed Instance)   <- evergreen, pseudo-major 9999
# Éditions non gérées : 6/9/11/12 (Synapse / SQL Edge / Fabric).

major_to_year:
  13: 2016
  14: 2017
  15: 2019
  16: 2022
  17: 2025

azure_pseudo_major: 9999          # appliqué quand EngineEdition ∈ {5, 8}

commands:

  rebuild_index:                  # ALTER INDEX ... REBUILD
    online:               { min_major: 9,  editions: [enterprise, azure] }                       # 2005
    wait_at_low_priority: { min_major: 12, editions: [enterprise, azure], requires: [online] }   # 2014
    resumable:            { min_major: 14, editions: [enterprise, azure], requires: [online] }   # 2017
    sort_in_tempdb:       { min_major: 9,  editions: [enterprise, standard, azure] }
    data_compression:     { min_major: 10, editions: [enterprise, azure] }                       # 2008
    maxdop:               { min_major: 9,  editions: [enterprise, standard, azure] }

  create_index:                   # CREATE [UNIQUE] INDEX
    online:               { min_major: 9,  editions: [enterprise, azure] }                       # 2005
    resumable:            { min_major: 15, editions: [enterprise, azure], requires: [online] }   # 2019
    wait_at_low_priority: { min_major: 16, editions: [enterprise, azure], requires: [online] }   # 2022
    sort_in_tempdb:       { min_major: 9,  editions: [enterprise, standard, azure] }
    data_compression:     { min_major: 10, editions: [enterprise, azure] }
    maxdop:               { min_major: 9,  editions: [enterprise, standard, azure] }

  alter_column:                   # ALTER TABLE ALTER COLUMN
    online:               { min_major: 13, editions: [enterprise, azure] }                       # 2016
    # WAIT_AT_LOW_PRIORITY n'est PAS supporté avec ONLINE ALTER COLUMN, quelle que soit la version.

  add_column:                     # ALTER TABLE ADD <column>
    # Aucune option injectable. La rapidité dépend du caractère metadata-only (default constant,
    # édition Enterprise, type/compression de la table) — évalué au pré-vol, jamais injecté.
    {}

  add_constraint:                 # ALTER TABLE ADD CONSTRAINT (PRIMARY KEY / UNIQUE)
    online:               { min_major: 13, editions: [enterprise, azure] }
    resumable:            { min_major: 16, editions: [enterprise, azure], requires: [online] }   # 2022

  drop_index:        {}
  drop_column:       {}
  drop_constraint:   {}
