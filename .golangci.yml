# golangci-lint configuration for SqlGoPace.
# Run with: golangci-lint run
run:
  timeout: 3m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - revive
    - gofmt
    - goimports
    - misspell
    - gocritic
    - errorlint      # enforce %w / errors.Is/As usage
    - bodyclose
    - nilerr
    - unconvert
    - prealloc

linters-settings:
  goimports:
    local-prefixes: github.com/rudi-bruchez/SqlGoPace
  revive:
    rules:
      - name: exported
        arguments: [checkPrivateReceivers]
  misspell:
    locale: US

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Test files may be a little looser.
    - path: _test\.go
      linters:
        - prealloc
