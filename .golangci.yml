# golangci-lint configuration for SqlGoPace (schema v2).
# Run with: golangci-lint run
# errcheck / govet / staticcheck / ineffassign / unused are part of the v2 default
# set and run without being listed here.
version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - prealloc
    - revive
    - unconvert
  settings:
    misspell:
      locale: US
      # "compresion" is a deliberate typo: it is the fixture that proves a misspelled
      # manifest key is rejected rather than silently dropped, and the comment that
      # explains why. It lives inside a raw string literal, where a nolint directive
      # cannot be placed.
      ignore-rules:
        - compresion
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - prealloc
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/rudi-bruchez/SqlGoPace
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
