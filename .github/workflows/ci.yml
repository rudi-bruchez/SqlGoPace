name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt reports these files:"; echo "$unformatted"; exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      # v6 of the action resolves "latest" within the golangci-lint v1 line, which is
      # built with an older Go than this module targets. That combination refuses to
      # start ("the Go language version used to build golangci-lint is lower than the
      # targeted Go version") and had kept this job red for weeks. The config here is
      # schema v2, so the action and the binary must be v2-aware, and the version is
      # pinned rather than floating: a silently resolved upgrade is what broke it.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

