name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  integration:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Str0ng_Passw0rd!"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 30); do
            if docker run --rm --network host mcr.microsoft.com/mssql-tools18 \
                /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Str0ng_Passw0rd!" -C -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server is up"; exit 0
            fi
            echo "waiting ($i)..."; sleep 5
          done
          echo "SQL Server did not become ready"; exit 1
      - name: Integration tests
        env:
          SQLGOPACE_TEST_DSN: "sqlserver://sa:Str0ng_Passw0rd!@localhost:1433?database=tempdb&encrypt=disable"
        run: go test -tags=integration ./...
