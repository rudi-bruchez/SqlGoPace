# Manifeste d'exemple — voir specs/SPECS.md §1 pour le schéma complet.
# Un fichier = une tâche logique = une liste d'opérations exécutées SÉQUENTIELLEMENT.
# Les options laissées vides (online / resumable / wait_at_low_priority / maxdop / sort_in_tempdb)
# sont injectées automatiquement selon version + édition + matrice (ddl_compatibility.yaml).

description: "Recompression des index de DISPATCH + ajout d'une colonne de suivi"
database: EXAMPLEDB          # optionnel : sinon la base de la chaîne de connexion

operations:

  # 1) Reconstruction d'index avec compression PAGE.
  #    L'outil injectera ONLINE / RESUMABLE / WAIT_AT_LOW_PRIORITY si la cible les supporte.
  - operation: rebuild_index
    schema: dbo
    table: DISPATCH
    index: IX_DISPATCH        # ou "ALL" pour reconstruire tous les index de la table
    data_compression: PAGE
    options:
      maxdop: 4              # override explicite pour CETTE opération

  # 2) Ajout d'une colonne NOT NULL avec default constant.
  #    En Enterprise, c'est une opération metadata-only (signalée au pré-vol, cf. §1.4).
  - operation: add_column
    schema: dbo
    table: DISPATCH
    column: PROCESSED
    type: BIT
    nullable: false
    default: 0
